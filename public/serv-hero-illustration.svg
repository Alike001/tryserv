 <linearGradient id="desk" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#315271"/><stop offset="1" stop-color="#18324a"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294b70"/><stop offset="1" stop-color="#0f2a40"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf5d0"/><stop offset="1" stop-color="#38d4ad"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#204d79" flood-opacity=".16"/></filter>
 <filter id="sm" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173e62" flood-opacity=".13"/></filter>
