  <text x="532" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#526b8f">CHECK</text>
  <rect x="309" y="235" width="250" height="84" rx="11" fill="url(#screen)"/>
  <circle class="screenGlow" cx="327" cy="255" r="4.5" fill="#38d4ad"/>
  <path d="M342 253h105" stroke="#d5e7f8" stroke-width="5" stroke-linecap="round"/>
  <path d="M327 271h152" stroke="#8fc1e5" stroke-width="4" stroke-linecap="round"/>
  <path d="M327 286h126" stroke="#698fab" stroke-width="4" stroke-linecap="round"/>
  <rect x="465" y="292" width="78" height="18" rx="7" fill="#246d5d"/>
  <text x="504" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.2" fill="#e9fdf4" font-weight="700">PREVIEW ONLY</text>
 </g>
