<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 515" role="img" aria-labelledby="humanTitle humanDesc">
<title id="humanTitle">TrySERV — animated developer learning to work with SERV</title>
<desc id="humanDesc">Original character illustration of a thoughtful developer with a face, expressive eyes, headphones, a hoodie and hands at a laptop. Behind the developer, a conceptual learning-to-reasoning-to-verification panel gently animates. This is an educational illustration, not live inference.</desc>
<defs>
 <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f6ff"/><stop offset=".65" stop-color="#ecf5ff"/><stop offset="1" stop-color="#e5fbf2"/></linearGradient>
 <linearGradient id="skin" x1=".05" y1=".2" x2=".9" y2=".85"><stop stop-color="#fac39b"/><stop offset=".44" stop-color="#e5a47d"/><stop offset="1" stop-color="#bb795e"/></linearGradient>
 <linearGradient id="faceGlow" x1=".1" y1="0" x2="1" y2="1"><stop stop-color="#f4b890"/><stop offset=".58" stop-color="#de9d78"/><stop offset="1" stop-color="#b76e54"/></linearGradient>
 <linearGradient id="hoodie" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#4269e9"/><stop offset=".48" stop-color="#2e54b9"/><stop offset="1" stop-color="#18376a"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#3c3047"/><stop offset=".5" stop-color="#222436"/><stop offset="1" stop-color="#151a2b"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#284f73"/><stop offset="1" stop-color="#0e293e"/></linearGradient>
 <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4faff"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c9cbd"/><stop offset="1" stop-color="#375a79"/></linearGradient>
 <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#163d69" flood-opacity=".14"/></filter>
 <filter id="dropSmall" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#163f70" flood-opacity=".12"/></filter>
 <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#94b4d8" opacity=".35"/></pattern>
 <clipPath id="bounds"><rect x="12" y="12" width="596" height="490" rx="29"/></clipPath>
 <style>
   .scene-board{animation:floatBoard 6s ease-in-out infinite}
   .person{animation:breathing 4.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
   .leftHand{animation:typeLeft .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
   .rightHand{animation:typeRight .72s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
   .eyelids{animation:blink 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center center}
   .screenGlow{animation:screenPulse 3.3s ease-in-out infinite}
   .dotOne{animation:dotPulse 3s ease-in-out infinite}
   .dotTwo{animation:dotPulse 3s ease-in-out infinite .8s}
   .dotThree{animation:dotPulse 3s ease-in-out infinite 1.6s}
   .connector{stroke-dasharray:6 8;animation:moveDashes 3s linear infinite}
   .starOne{animation:twinkle 3.2s ease-in-out infinite}
   .starTwo{animation:twinkle 3.9s ease-in-out infinite 1s}
   @keyframes floatBoard{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
   @keyframes breathing{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
   @keyframes typeLeft{0%{transform:translateY(0)}100%{transform:translateY(2px) rotate(-2deg)}}
   @keyframes typeRight{0%{transform:translateY(1px)}100%{transform:translateY(-2px) rotate(2deg)}}
   @keyframes blink{0%,43%,45%,97%,100%{transform:scaleY(0)}44%,98%{transform:scaleY(1)}}
   @keyframes screenPulse{0%,100%{opacity:.7}50%{opacity:1}}
   @keyframes dotPulse{0%,100%{opacity:.45}45%{opacity:1}}
   @keyframes moveDashes{from{stroke-dashoffset:0}to{stroke-dashoffset:-28}}
   @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
   @media(prefers-reduced-motion:reduce){.scene-board,.person,.leftHand,.rightHand,.eyelids,.screenGlow,.dotOne,.dotTwo,.dotThree,.connector,.starOne,.starTwo{animation:none!important}.eyelids{transform:scaleY(0)}}
 </style>
</defs>
<g clip-path="url(#bounds)">
 <rect x="12" y="12" width="596" height="490" rx="29" fill="url(#scene)"/>
 <rect x="12" y="12" width="596" height="490" rx="29" fill="url(#grid)"/>
 <circle cx="550" cy="78" r="130" fill="#cbdeff" opacity=".52"/>
 <circle cx="50" cy="440" r="134" fill="#c9f4e6" opacity=".7"/>
